name: Linux

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/archlinux/archlinux:latest
    steps:
      - name: Checkout submodules
        uses: actions/checkout@v2
        with:
          submodules: true
      - name: Install libs
        run: pacman --noconfirm -S sdl2-compat glew glm gtk3 base-devel
      - name: cmake
        run: sudo cmake -DCMAKE_CXX_COMPILER=/usr/bin/g++-9 -DCMAKE_C_COMPILER=/usr/bin/gcc-9 .
      - name: make
        run: sudo make
