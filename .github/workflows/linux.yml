name: Linux

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/archlinux/archlinux:latest
    steps:
      - name: Install libs
        run: pacman --noconfirm -Syyu git sdl2-compat glew glm gtk3 base-devel cmake
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true
      - name: cmake
        run: sudo cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_CXX_COMPILER=/usr/bin/g++ -DCMAKE_C_COMPILER=/usr/bin/gcc .
      - name: make
        run: sudo make
